<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"><rect width="512" height="512" fill="#FFFFFF"/><g transform="translate(-37.62 3.87) scale(1.06383)"><style>
    .spin { stroke-dasharray:123.2 316.7;
             animation: orbit 1.4s linear infinite;
             transform-origin: 276px 190px; }
    .pulse { animation: beat 1.4s ease-in-out infinite;
              transform-box: fill-box; transform-origin: center; }
