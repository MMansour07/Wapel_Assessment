<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844"><style>
    .ring { stroke-dasharray:439.8; stroke-dashoffset:439.8;
             animation: dr 0.75s cubic-bezier(.55,0,.35,1) 0.2s both; }
    .tail { stroke-dasharray:86.6; stroke-dashoffset:86.6;
             animation: dt 0.4s ease-out 0.85s both; }
    .drop { animation: fall 0.55s cubic-bezier(.34,1.56,.64,1) 1.25s both;
             transform-box: fill-box; transform-origin: center; }
    .glyph { animation: pop .5s cubic-bezier(.22,1,.36,1) both;
              transform-box: fill-box; transform-origin: center bottom; }
    .arw { opacity:0; animation: rise .6s cubic-bezier(.22,1,.36,1) 2.15s forwards; }
    .loader { opacity:0; animation: fadein .5s ease-out 2.65s forwards; }
    .loader circle { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes dr { to { stroke-dashoffset:0; } }
    @keyframes dt { to { stroke-dashoffset:0; } }
    @keyframes fall { from { opacity:0; transform: translateY(-30px) scale(.5); }
                       to { opacity:1; transform:none; } }
    @keyframes pop { from { opacity:0; transform: translateX(14px); }
                      to { opacity:1; transform:none; } }
    @keyframes rise { from { opacity:0; transform: translateY(10px); }
                       to { opacity:0.75; transform:none; } }
    @keyframes fadein { to { opacity:1; } }
    @keyframes pulse { 0%,100% { opacity:.3; } 50% { opacity:1; } }
    @media (prefers-reduced-motion: reduce) {
      .ring,.tail { animation:none; stroke-dashoffset:0; }
      .drop,.glyph,.loader,.loader circle { animation:none; opacity:1; }
      .arw { animation:none; opacity:0.75; }
