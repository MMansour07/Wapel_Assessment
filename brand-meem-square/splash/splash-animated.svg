<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844"><style>
    .card { animation: card .55s cubic-bezier(.22,1,.36,1) 0.1s both;
             transform-box: fill-box; transform-origin: center; }
    .ring { animation: rise .6s cubic-bezier(.22,1,.36,1) 0.45s both;
             transform-box: fill-box; transform-origin: center; }
    .st rect { animation: slide .45s cubic-bezier(.22,1,.36,1) both; }
    .st rect:nth-child(1) { animation-delay: 0.85s; }
    .st rect:nth-child(2) { animation-delay: 0.98s; }
    .st rect:nth-child(3) { animation-delay: 1.1099999999999999s; }
    .tail { animation: drop .5s cubic-bezier(.22,1,.36,1) 1.3s both;
             transform-box: fill-box; transform-origin: top center; }
    .damma { animation: spring .55s cubic-bezier(.34,1.56,.64,1) 1.55s both;
              transform-box: fill-box; transform-origin: center; }
    .glyph { animation: pop .5s cubic-bezier(.22,1,.36,1) both;
              transform-box: fill-box; transform-origin: center bottom; }
    .loader { opacity:0; animation: fadein .5s ease-out 2.7s forwards; }
    .loader circle { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes card   { from { opacity:0; transform: scale(.94) translateY(14px); }
                         to   { opacity:1; transform: none; } }
    @keyframes rise   { from { opacity:0; transform: translateY(18px) scale(.96); }
                         to   { opacity:1; transform: none; } }
    @keyframes slide  { from { opacity:0; transform: translateX(26px); }
                         to   { opacity:1; transform: none; } }
    @keyframes drop   { from { opacity:0; transform: scaleY(0); }
                         to   { opacity:1; transform: scaleY(1); } }
    @keyframes spring { from { opacity:0; transform: translateY(-30px); }
                         to   { opacity:1; transform: none; } }
    @keyframes pop    { from { opacity:0; transform: translateY(12px); }
                         to   { opacity:1; transform: none; } }
    @keyframes fadein { to { opacity:1; } }
    @keyframes pulse  { 0%,100% { opacity:.3; } 50% { opacity:1; } }
    @media (prefers-reduced-motion: reduce) {
      .card,.ring,.st rect,.tail,.damma,.glyph,.loader,.loader circle
      { animation: none; opacity: 1; transform: none; }
    }</style><rect width="390" height="844" fill="#DEE7FF"/><g class="card"><rect x="45" y="168" width="300" height="470" rx="30" fill="#FFFFFF"/></g><g transform="translate(78.08 208.65) scale(0.56757)"><g class="ring"><path fill-rule="evenodd" fill="#6C8DDF" d="M 174 96 H 326 Q 350 96 350 120 V 272 Q 350 296 326 296 H 174 Q 150 296 150 272 V 120 Q 150 96 174 96 Z M 196 142 V 250 H 304 V 142 Z"/></g><g class="st"><rect x="196" y="224" width="108" height="26" fill="#6C8DDF"/><rect x="232" y="198" width="72" height="26" fill="#6C8DDF"/><rect x="268" y="172" width="36" height="26" fill="#6C8DDF"/></g><g class="tail"><g fill="#6C8DDF"><rect x="150" y="272" width="46" height="118" rx="0"/><path d="M 76 344 H 196 V 390 H 76 Q 62 390 62 376 V 358 Q 62 344 76 344 Z"/></g></g><g class="damma"><path fill-rule="evenodd" fill="#074D31" d="M 302 20 H 336 Q 348 20 348 32 V 64 Q 348 76 336 76 H 302 Q 290 76 290 64 V 32 Q 290 20 302 20 Z M 308 38 V 58 H 330 V 38 Z"/><rect x="266" y="58" width="24" height="18" fill="#074D31"/></g></g><g transform="translate(156.72 520.34)"><g class="glyph" style="animation-delay:2.27s"><path d="M19.02719091796875 0.0V-2.99972021484375H22.888643554687498V0.0ZM15.61285107421875 8.044751953125 16.12070068359375 10.748887207031249Q14.44387060546875 11.105094726562498 13.012389404296874 11.303094726562499Q11.580908203124999 11.5010947265625 10.29436083984375 11.5010947265625Q7.586718749999999 11.5010947265625 5.586765380859374 10.655066162109375Q3.5868120117187496 9.80903759765625 2.513406005859375 8.170046630859375Q1.44 6.5310556640624995 1.44 4.23458349609375Q1.44 1.9343188476562498 2.513406005859375 0.313327880859375Q3.5868120117187496 -1.3076630859374998 5.586765380859374 -2.1536916503906247Q7.586718749999999 -2.99972021484375 10.326568359374999 -2.99972021484375H15.697696289062499V0.0H10.326568359374999Q7.4523427734375 0.0 6.1270224609375 1.079009033203125Q4.801702148437499 2.15801806640625 4.801702148437499 4.2667910156249995Q4.801702148437499 6.3